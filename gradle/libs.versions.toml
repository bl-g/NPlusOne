[versions]
opentelemetry = "1.68.0"
opentelemetry-agent = "2.34.0"
opentelemetry-semconv = "1.43.0"
opentelemetry-proto = "1.10.0-alpha"
slf4j = "2.0.17"
caffeine = "3.2.3"
spring-boot = "3.5.10"
spring-boot-example = "3.5.0"
grpc = "1.82.0"
sqlite = "3.53.2.1"
junit-jupiter = "5.13.4"
junit-platform = "1.13.4"
junit4 = "4.13.2"
shadow = "9.6.1"
nplusone = "0.1.0-beta.2"

[libraries]
opentelemetry-bom = { module = "io.opentelemetry:opentelemetry-bom", version.ref = "opentelemetry" }
# These versions are supplied by the BOM in each consuming configuration.
opentelemetry-api = { module = "io.opentelemetry:opentelemetry-api" }
opentelemetry-sdk-trace = { module = "io.opentelemetry:opentelemetry-sdk-trace" }
opentelemetry-sdk-autoconfigure-spi = { module = "io.opentelemetry:opentelemetry-sdk-extension-autoconfigure-spi" }
opentelemetry-agent = { module = "io.opentelemetry.javaagent:opentelemetry-javaagent", version.ref = "opentelemetry-agent" }
opentelemetry-semconv = { module = "io.opentelemetry.semconv:opentelemetry-semconv", version.ref = "opentelemetry-semconv" }
opentelemetry-proto = { module = "io.opentelemetry.proto:opentelemetry-proto", version.ref = "opentelemetry-proto" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
caffeine = { module = "com.github.ben-manes.caffeine:caffeine", version.ref = "caffeine" }
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-boot-example-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot-example" }

# Spring Boot supplies versions for these libraries in consuming configurations.
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-thymeleaf = { module = "org.springframework.boot:spring-boot-starter-thymeleaf" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
jackson-jsr310 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310" }
hikari = { module = "com.zaxxer:HikariCP" }
jooq = { module = "org.jooq:jooq" }
h2 = { module = "com.h2database:h2" }

grpc-bom = { module = "io.grpc:grpc-bom", version.ref = "grpc" }
# The gRPC BOM supplies these versions.
grpc-netty-shaded = { module = "io.grpc:grpc-netty-shaded" }
grpc-protobuf = { module = "io.grpc:grpc-protobuf" }
grpc-stub = { module = "io.grpc:grpc-stub" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit-jupiter" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit-jupiter" }
junit-platform-commons = { module = "org.junit.platform:junit-platform-commons", version.ref = "junit-platform" }
# The JUnit BOM supplies this version in the standalone Gradle example.
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
junit4 = { module = "junit:junit", version.ref = "junit4" }

shadow-gradle-plugin = { module = "com.gradleup.shadow:shadow-gradle-plugin", version.ref = "shadow" }
# Published NPlusOne artifacts consumed by the standalone Gradle example.
nplusone-test-junit-jupiter = { module = "com.goosb.nplusone:nplusone-test-junit-jupiter", version.ref = "nplusone" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-boot-example = { id = "org.springframework.boot", version.ref = "spring-boot-example" }
nplusone = { id = "com.goosb.nplusone", version.ref = "nplusone" }
