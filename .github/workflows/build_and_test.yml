name: Gradle build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew --no-daemon build

      - name: Upload JARs and Compose file
        uses: actions/upload-artifact@v4
        with:
          name: nplusone-jars
          path: |
            compose.yaml
            nplusone-*/build/libs/*.jar
            nplusone-plugin-maven/target/*.jar
            !**/javaagentLibs-relocated.jar
            !**/*-plain.jar
          if-no-files-found: error
          retention-days: 3
