services:
  backend:
    image: ghcr.io/${NPLUSONE_IMAGE_OWNER:-bl-g}/nplusone-backend:${NPLUSONE_VERSION:-latest}
    environment:
      NPLUSONE_FRONTEND_ORIGIN: "http://localhost:${NPLUSONE_FRONTEND_PORT:-8082}"
    ports:
      - "127.0.0.1:${NPLUSONE_BACKEND_PORT:-8081}:8081"
      - "127.0.0.1:${NPLUSONE_OTLP_PORT:-4317}:4317"
    volumes:
      - nplusone-data:/data
    restart: unless-stopped

  frontend:
    image: ghcr.io/${NPLUSONE_IMAGE_OWNER:-bl-g}/nplusone-frontend:${NPLUSONE_VERSION:-latest}
    environment:
      NPLUSONE_BACKEND_URL: "http://localhost:${NPLUSONE_BACKEND_PORT:-8081}/api/rows"
    ports:
      - "127.0.0.1:${NPLUSONE_FRONTEND_PORT:-8082}:8082"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  nplusone-data:
